# .github/workflows/promote-dev-to-main-release.yaml
#
# Manually-triggered release: promote dev → main, tag it, cut a GitHub Release,
# and open the next in-development version on dev.
#
# BRANCH MODEL
#   dev  — development (default branch). All PRs merge here.
#   main — the released line. Consumers pin the `@vX.Y.Z` tags cut FROM main.
#
# VERSIONING
#   Resolve → MobileByteLabs/mbl-actionhub-resolve-version (github-releases mode) for the bump
#   intent + explicit-override, THEN floored at the highest existing git tag (Releases can lag
#   tags — Releases stopped at v1.0.47 while tags reached v1.0.61 — so tags are the
#   authoritative uniqueness source). Maven checks off (not a Maven artifact). There is NO
#   dev-only version marker file: the git TAG is the version, so `main` and `dev` stay
#   content-identical after a release.
#
# "Rebase main with dev" == set `main` to dev's EXACT commit
# (`git push --force-with-lease origin dev:main`), so after every release `main == dev`
# (0 ahead / 0 behind — the signal that dev's stable state was promoted). The first alignment
# (main/dev started as unrelated histories) force-updates; later releases fast-forward.
# Consumers pin vX.Y.Z TAGS, not the `main` ref, so moving `main` never breaks a pinned consumer.
#
# TOKEN
#   Promoting dev's `.github/workflows/**` onto main requires a PAT with the `workflow`
#   scope (GITHUB_TOKEN may not write workflow files). Store it as `RELEASE_TOKEN`; the
#   workflow falls back to github.token when a release carries no workflow-file changes.
name: Release · Promote dev → main

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump for this release (ignored if release_version is set)'
        type: choice
        options: [patch, minor, major]
        default: patch
      release_version:
        description: 'Explicit version e.g. v1.0.30 (overrides bump; blank = auto)'
        type: string
        required: false
      dry_run:
        description: 'Resolve + log only — no push, tag, or release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Source of truth = GitHub Releases on this repo. Maven verification disabled (not a
      # Maven artifact); group-id/artifact-id are required inputs but unused in this mode.
      - name: Resolve release version
        id: resolve
        uses: MobileByteLabs/mbl-actionhub-resolve-version@v1.2.0
        with:
          group-id: openMF
          artifact-id: mifos-x-actionhub
          version-source: github-releases
          bump: ${{ inputs.bump }}
          version: ${{ inputs.release_version }}
          verify-against-maven: 'false'
          tag-pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+$'

      # Tag-authoritative floor. GitHub Releases can lag tags (in this repo, Releases stop at
      # v1.0.47 while tags run to v1.0.61), so the resolver's Releases-based proposal may
      # undershoot. Floor the version at latest-tag+bump and take the higher of that vs. the
      # resolver's intent — guaranteeing the release never collides with / regresses below an
      # existing tag. Once a release publishes tag+Release together, the two converge and the
      # resolver becomes authoritative on its own.
      - name: Normalize + guard version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          RAW='${{ steps.resolve.outputs.version }}'
          RNUM=${RAW#v}
          echo "$RNUM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::resolver returned non-semver: '$RAW'"; exit 1; }
          if [ -n "${{ inputs.release_version }}" ]; then
            # Explicit override: honor exactly; collision-guard only.
            NUM=$RNUM
          else
            LT=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1); LT=${LT#v}; LT=${LT:-0.0.0}
            a=${LT%%.*}; r=${LT#*.}; b=${r%%.*}; c=${r##*.}
            case "${{ inputs.bump }}" in
              major) FLOOR="$((a+1)).0.0" ;;
              minor) FLOOR="${a}.$((b+1)).0" ;;
              *)     FLOOR="${a}.${b}.$((c+1))" ;;
            esac
            NUM=$(printf '%s\n%s\n' "$RNUM" "$FLOOR" | sort -V | tail -1)
          fi
          TAG="v$NUM"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists — pass a higher release_version."; exit 1
          fi
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo "- resolver: \`${{ steps.resolve.outputs.version }}\` (source \`${{ steps.resolve.outputs.source }}\`, current \`${{ steps.resolve.outputs.current }}\`)"
            echo "- highest existing tag floored the result (Releases lag tags in this repo)"
            echo "- **this release: \`$TAG\`**"
            echo "- dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Make `main` mirror `dev` EXACTLY (same commit) so `main == dev` right after release —
      # 0 ahead / 0 behind. First alignment (unrelated histories) force-updates; once main sits
      # on dev's history, later releases fast-forward. Consumers pin vX.Y.Z TAGS, not the main
      # ref, so moving main never breaks a pinned consumer. force-with-lease guards against a
      # concurrent main push (fails safe rather than clobbering).
      - name: Promote dev → main  (main := dev, exact)
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git fetch origin dev main --quiet || git fetch origin dev --quiet
          DEV=$(git rev-parse origin/dev)
          git push --force-with-lease origin "$DEV:refs/heads/main"
          echo "MAIN_SHA=$DEV" >> "$GITHUB_ENV"

      - name: Tag + GitHub Release on main
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.ver.outputs.tag }}'
          git tag -a "$TAG" "$MAIN_SHA" -m "$TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --latest
          echo "released **$TAG** on main @ \`$MAIN_SHA\` — main now equals dev" >> "$GITHUB_STEP_SUMMARY"

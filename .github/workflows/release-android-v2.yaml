# .github/workflows/release-android-v2.yaml
#
# Thin wrapper → therajanmaurya/mifos-x-actionhub-publish-android-kmp @v2.0.31: `firebase` goes to
# release-firebase.yaml (Firebase App Distribution), every other rung to release.yaml (the Play ladder).
# Provides a stable @v1.0.17+ entry point for consumers who want the discoverable
# mifos-x-actionhub interface instead of referencing the platform repo directly.
#
# Play App Signing model (per https://support.google.com/googleplay/android-developer/answer/9842756):
# Google holds the app signing key in KMS; developer only holds the upload key.
# Single keystore (upload_keystore) replaces the legacy release_keystore (as of v2.0.4).
name: v2 · Release Android

on:
  workflow_call:
    inputs:
      android_package_name: { required: true,  type: string, description: 'Gradle module (e.g. cmp-android)' }
      version_tag:          { required: true,  type: string, description: 'Version tag (e.g. v2026.06.16)' }
      starting_rung:        { required: false, type: string, default: 'firebase', description: 'firebase | internal | closed | beta | production' }
      tester_groups:        { required: false, type: string, default: 'qa-team,beta-testers', description: 'Firebase tester groups' }
      production_rollout:   { required: false, type: string, default: '0.10', description: 'Stage 3 staged rollout percentage' }
    secrets:
      google_services:          { required: true }
      firebase_creds:           { required: true }
      playstore_creds:          { required: true }
      upload_keystore:          { required: true }
      keystore_password:        { required: true }
      keystore_alias:           { required: true }
      # NOT required: a PKCS12 keystore (keytool's default) has no separate key password — keytool
      # discards `-keypass` at creation with "Different store and key passwords not supported for
      # PKCS12 KeyStores". Callers passing only keystore_password are correct, and requiring this
      # rejected them at the contract boundary. Tier 3 (publish-android-kmp) already declares it
      # optional and defaults it from keystore_password.
      keystore_alias_password:  { required: false }

  workflow_dispatch:
    inputs:
      android_package_name: { required: true,  type: string, default: 'cmp-android' }
      version_tag:          { required: true,  type: string }
      starting_rung:        { required: false, type: choice, options: [firebase, internal, closed, beta, production], default: firebase }

jobs:
  # Since the firebase ∥ play split (publish-android-kmp v2.0.17, on dev from v2.0.31) release.yaml is the
  # Play ladder only; Firebase App Distribution is release-firebase.yaml. The rung picks one of them —
  # `firebase` alone distributes to Firebase, as release.yaml's Stage 0 did before the split.
  firebase:
    if: ${{ inputs.starting_rung == 'firebase' }}
    uses: therajanmaurya/mifos-x-actionhub-publish-android-kmp/.github/workflows/release-firebase.yaml@v2.0.31
    with:
      android_package_name: ${{ inputs.android_package_name }}
      version_tag:          ${{ inputs.version_tag }}
      tester_groups:        ${{ inputs.tester_groups }}
    secrets: inherit

  delegate:
    if: ${{ inputs.starting_rung != 'firebase' }}
    uses: therajanmaurya/mifos-x-actionhub-publish-android-kmp/.github/workflows/release.yaml@v2.0.31
    with:
      android_package_name: ${{ inputs.android_package_name }}
      version_tag:          ${{ inputs.version_tag }}
      starting_rung:        ${{ inputs.starting_rung }}
      tester_groups:        ${{ inputs.tester_groups }}
      production_rollout:   ${{ inputs.production_rollout }}
    secrets: inherit
